name: Ultimate Remote CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  central-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install central dependencies
        run: python -m pip install -r requirements.txt
      - name: Run central tests
        run: python -B -m unittest discover -s tests -v

  windows-agent:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        shell: pwsh
        run: dotnet restore .\UltimateRemoteAgent\UltimateRemoteAgent.slnx
      - name: Build
        shell: pwsh
        run: dotnet build .\UltimateRemoteAgent\UltimateRemoteAgent.slnx -c Release --no-restore
      - name: Test
        shell: pwsh
        run: dotnet test .\UltimateRemoteAgent\UltimateRemoteAgent.slnx -c Release --no-build
      - name: Verify formatting
        shell: pwsh
        run: dotnet format .\UltimateRemoteAgent\UltimateRemoteAgent.slnx --verify-no-changes --no-restore
      - name: Publish self-contained Agent
        shell: pwsh
        run: dotnet publish .\UltimateRemoteAgent\src\UltimateRemoteAgent\UltimateRemoteAgent.csproj -c Release -p:PublishProfile=win-x64
      - name: Smoke-build zero-config client package
        shell: pwsh
        run: |
          .\tools\package_remote_preview.ps1 -PublicOrigin https://remote.example -OutputDirectory .\ci-package
          if (-not (Test-Path .\ci-package\Ultimate_Macro_Remote_Preview.zip)) { throw "Client package was not produced." }
